<ion-content fullscreen [class.has-tabs]="auth.user()?.role !== 'coach'">
  <!-- COACH PROFILE -->
  <app-brand-header-shell *ngIf="auth.user()?.role === 'coach'" title="Profile" (back)="goBack()">
  <button headerEnd type="button" class="app-header-btn grid place-items-center rounded-full bg-white shadow-sm text-slate-800 border-none" aria-label="Settings" (click)="router.navigateByUrl('/app/coach/settings')">
    <ion-icon name="settings-outline" class="text-xl"></ion-icon>
  </button>
  <main class="min-h-full bg-[#FAFBFC] text-slate-800 select-none">
    <section class="coach-profile-hero px-6 pt-6 pb-8 bg-gradient-to-b from-[var(--app-primary)]/20 to-transparent">
      <div class="flex flex-col items-center">
        <div class="relative mb-4 grid h-24 w-24 place-items-center rounded-full bg-gradient-to-br from-[var(--app-primary)] to-[#FF7A00] text-5xl shadow-md overflow-hidden">
          <img *ngIf="profileImage()" [src]="profileImage()!" alt="" class="h-full w-full object-cover" />
          <span *ngIf="!profileImage()">👨‍🏫</span>
        </div>
        <h1 class="mb-1 text-[24px] font-black text-[#111827]">{{ auth.user()?.name || 'Coach Arvind' }}</h1>
        <div class="mb-3 text-sm text-[#9CA3AF]">Football & Cricket</div>
        <div class="inline-flex items-center gap-2 rounded-full bg-white px-4 py-2 shadow-sm border border-[#F3F4F6]">
          <ion-icon name="star" class="text-xl text-[#FF7A00]"></ion-icon>
          <span class="font-semibold text-[#111827]">4.9 Rating</span>
        </div>
      </div>
    </section>

    <section class="space-y-6 px-6 pb-8 -mt-4">
      <div class="rounded-xl border border-[#F3F4F6] bg-white p-4 shadow-sm">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <div class="text-sm text-[#9CA3AF] mb-1">Experience</div>
            <div class="font-semibold text-[#111827]">12 years</div>
          </div>
          <div>
            <div class="text-sm text-[#9CA3AF] mb-1">Certification</div>
            <div class="font-semibold text-[#111827]">UEFA Pro License</div>
          </div>
        </div>
      </div>

      <div>
        <h3 class="app-section-title mb-3">Stats</h3>
        <div class="grid grid-cols-3 gap-3">
          <div class="rounded-xl border border-[#F3F4F6] bg-white p-4 text-center shadow-sm">
            <ion-icon name="people-outline" class="mx-auto mb-2 text-2xl text-[var(--app-primary)]"></ion-icon>
            <div class="mb-1 text-xl font-black text-[#111827]">3</div>
            <div class="text-xs text-[#9CA3AF]">Teams Coached</div>
          </div>
          <div class="rounded-xl border border-[#F3F4F6] bg-white p-4 text-center shadow-sm">
            <ion-icon name="trending-up-outline" class="mx-auto mb-2 text-2xl text-[var(--app-primary)]"></ion-icon>
            <div class="mb-1 text-xl font-black text-[#111827]">45</div>
            <div class="text-xs text-[#9CA3AF]">Total Players</div>
          </div>
          <div class="rounded-xl border border-[#F3F4F6] bg-white p-4 text-center shadow-sm">
            <ion-icon name="trophy-outline" class="mx-auto mb-2 text-2xl text-[var(--app-primary)]"></ion-icon>
            <div class="mb-1 text-xl font-black text-[#111827]">72%</div>
            <div class="text-xs text-[#9CA3AF]">Success Rate</div>
          </div>
        </div>
      </div>

      <div>
        <h3 class="app-section-title mb-3">Achievements</h3>
        <div class="grid grid-cols-2 gap-3">
          <div *ngFor="let achievement of coachAchievements" class="flex items-center gap-3 rounded-xl border border-[#F3F4F6] bg-white p-4 shadow-sm">
            <div class="grid h-10 w-10 place-items-center rounded-lg bg-[var(--app-primary)]/20">
              <ion-icon [name]="achievement.icon" class="text-xl" [style.color]="achievement.color"></ion-icon>
            </div>
            <span class="text-sm font-medium text-[#111827]">{{ achievement.name }}</span>
          </div>
        </div>
      </div>

      <div>
        <div class="mb-3 flex items-center justify-between">
          <h3 class="app-section-title m-0">Recent Sessions</h3>
          <button type="button" class="flex items-center gap-1 text-sm font-bold text-[var(--app-primary)] bg-transparent border-none" (click)="router.navigateByUrl('/app/coach/schedule')">
            View All
            <ion-icon name="chevron-forward-outline"></ion-icon>
          </button>
        </div>
        <div class="space-y-2">
          <div *ngFor="let session of coachRecentSessions" class="flex items-center justify-between rounded-xl border border-[#F3F4F6] bg-white p-4 shadow-sm">
            <div>
              <div class="font-semibold text-[#111827]">{{ session.team }}</div>
              <div class="text-sm text-[#9CA3AF] mt-0.5">{{ session.date }}</div>
            </div>
            <span class="px-2.5 py-1 bg-[var(--app-primary)]/20 text-[#111827] text-xs font-bold rounded-full">{{ session.type }}</span>
          </div>
        </div>
      </div>
    </section>
  </main>
  </app-brand-header-shell>

  <!-- PLAYER PROFILE -->
  <app-brand-header-shell *ngIf="auth.user()?.role !== 'coach'" title="Profile">
    <main class="profile-page page-with-tab-bar" *ngIf="auth.user()?.role !== 'venue'">
      <app-player-profile></app-player-profile>
    </main>
  </app-brand-header-shell>
</ion-content>
